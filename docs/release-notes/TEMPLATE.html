<!--
  Lineform release notes — shown in the in-app updater's "What's New" pane (Sparkle).

  HOW TO USE
  1. Copy this file to  docs/release-notes/Lineform-<version>.html  for the release,
     e.g.  docs/release-notes/Lineform-1.3.0.html.
     The name MUST match the DMG exactly: Lineform-1.3.0.dmg → Lineform-1.3.0.html.
  2. Write the notes (replace the sample below). Delete this comment.
  3. Run the release as usual. packaging/generate-appcast.sh stages this file next to
     the DMG so Sparkle's generate_appcast embeds it into docs/appcast.xml automatically.
     No app code change is needed — the updater already renders it.

  WHAT TO WRITE  (this is what a real person reads before updating)
  - User-facing highlights ONLY. What someone notices and benefits from — NOT a
    changelog of internal refactors, renamed files, tests, or docs.
  - A few short bullets, most useful first. Plain language, no jargon.
  - Lead with new capabilities and visible improvements; then notable fixes.
  - Be honest and specific to THIS version. If a version is a small fix, say so
    in one line rather than padding it.
-->
<style>
  :root { color-scheme: light dark; }
  body { font: -apple-system-body, system-ui, sans-serif; line-height: 1.5; margin: 0; }
  h2 { font-size: 1.05rem; margin: 0 0 0.5em; }
  ul { margin: 0; padding-left: 1.2em; }
  li { margin: 0.35em 0; }
  strong { font-weight: 600; }
</style>

<h2>What's New in Lineform X.Y.Z</h2>
<ul>
  <li><strong>Headline change</strong> — one line on why it helps you.</li>
  <li>Another visible improvement people will notice.</li>
  <li>A notable fix that was worth calling out.</li>
</ul>
