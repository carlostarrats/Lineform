name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-26
    # Bound a hung test (AppKit-hosted state or slow file-presenter events on a
    # loaded runner) instead of billing the 6-hour default before the kill.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project Lineform.xcodeproj -scheme Lineform
      # The shared LineformCore package on its own: proves it builds and its tests pass
      # without the app (the iPhone app links the same package). Run through
      # xcodebuild, not `swift test`: the runner's command-line SwiftPM does not compile the
      # package's Localizable.xcstrings into .lproj folders, so the per-language tests fail
      # there while the app (built by xcodebuild) ships the translations correctly.
      - name: Test LineformCore package
        working-directory: Packages/LineformCore
        run: xcodebuild test -scheme LineformCore -destination 'platform=macOS'
      # The same package for iOS: catches macOS-only API or an import that would break the
      # iPhone app.
      - name: Build LineformCore for iOS
        working-directory: Packages/LineformCore
        run: xcodebuild -scheme LineformCore -destination 'generic/platform=iOS Simulator' build
      # Compiles the package's tests for iOS too, so a macOS-only call in a test (outside an
      # `#if os(macOS)` branch) fails CI. Build only: a generic destination does not depend on
      # the runner's simulator names. Run them locally on a simulator (see Claude.md).
      - name: Build LineformCore tests for iOS
        working-directory: Packages/LineformCore
        run: xcodebuild build-for-testing -scheme LineformCore -destination 'generic/platform=iOS Simulator'
      # The iPhone app and its tests compile for the simulator. Build only: a generic
      # destination does not depend on the runner's simulator names. Run the tests locally on a
      # simulator (see Claude.md, "iPhone app").
      - name: Build iPhone app tests
        run: xcodebuild build-for-testing -project Lineform.xcodeproj -scheme LineformiOS -destination 'generic/platform=iOS Simulator'
      # Runs the scheme's default test plan (Lineform.xctestplan): the full pure,
      # deterministic suite. The hosted-window motion tests (EditorDrawerMotionHostedTests,
      # LiveReloadScrollTests) are quarantined into the opt-in LineformHosted plan — they
      # need a quiet machine and are run manually before releases, never in CI.
      - name: Test
        run: |
          xcodebuild test \
            -project Lineform.xcodeproj \
            -scheme Lineform \
            -destination 'platform=macOS' \
            -parallel-testing-enabled NO
