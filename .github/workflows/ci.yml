name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project Lineform.xcodeproj -scheme Lineform
      # Runs the scheme's default test plan (Lineform.xctestplan): the full pure,
      # deterministic suite. The hosted-window motion tests (EditorDrawerMotionHostedTests,
      # LiveReloadScrollTests) are quarantined into the opt-in LineformHosted plan — they
      # need a quiet machine and are run manually before releases, never in CI.
      - name: Test
        run: |
          xcodebuild test \
            -project Lineform.xcodeproj \
            -scheme Lineform \
            -destination 'platform=macOS' \
            -parallel-testing-enabled NO
